<svg width="850" height="210" viewBox="0 0 850 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="footerCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131F" />
      <stop offset="50%" stop-color="#080C14" />
      <stop offset="100%" stop-color="#04060A" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="ambientBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#0070F3" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Dot Pattern -->
    <pattern id="footerDots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.04" />
    </pattern>

    <!-- Text Gradient -->
    <linearGradient id="quoteGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
  </defs>

  <!-- Ambient Light Spot -->
  <circle cx="425" cy="105" r="280" fill="url(#centerGlow)" />

  <!-- Base Card Frame -->
  <rect x="2" y="2" width="846" height="206" rx="16" fill="url(#footerCardBg)" />
  <rect x="2" y="2" width="846" height="206" rx="16" fill="url(#footerDots)" />
  
  <!-- Animated Border Glow -->
  <rect x="2" y="2" width="846" height="206" rx="16" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.7">
    <animate attributeName="stroke" values="#38BDF8;#A855F7;#EC4899;#38BDF8" dur="6s" repeatCount="indefinite" />
  </rect>

  <!-- Stylized Decorative Quote Mark -->
  <text x="425" y="48" text-anchor="middle" fill="#8B5CF6" font-family="'Georgia', serif" font-size="42" font-weight="bold" opacity="0.4">
    “
  </text>

  <!-- Main Quote -->
  <text x="425" y="76" text-anchor="middle" fill="url(#quoteGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="1">
    Build beyond the obvious.
  </text>

  <!-- Subtitle Heading -->
  <text x="425" y="108" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" letter-spacing="-0.3">
    Let's build something extraordinary together.
  </text>

  <!-- Description Text -->
  <text x="425" y="132" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400">
    Have an ambitious project, startup concept, or intelligent AI product in mind? Let's talk.
  </text>

  <!-- Divider Line -->
  <line x1="180" y1="152" x2="670" y2="152" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Live Status Beacon & Location -->
  <g transform="translate(245, 168)">
    <circle cx="10" cy="10" r="4.5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="10" cy="10" r="7.5" fill="none" stroke="#10B981" stroke-width="1" opacity="0.5">
      <animate attributeName="r" values="4;11;4" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;0;0.7" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="24" y="14" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11.5" font-weight="700" letter-spacing="0.8">
      STATUS: AVAILABLE FOR EXCITING PROJECTS
    </text>
  </g>
</svg>
