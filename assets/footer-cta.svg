<svg width="850" height="180" viewBox="0 0 850 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Card Background -->
    <linearGradient id="quoteBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1422" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Subtle Ambient Spotlight Glow -->
    <radialGradient id="quoteSpotlight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.15" />
      <stop offset="60%" stop-color="#818CF8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Modern Border -->
    <linearGradient id="borderStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#818CF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Quote Gradient Text -->
    <linearGradient id="quoteTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Subtle Dot Grid -->
    <pattern id="cardDots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.03" />
    </pattern>
  </defs>

  <!-- Base Card Frame -->
  <rect x="2" y="2" width="846" height="176" rx="14" fill="url(#quoteBg)" />
  <rect x="2" y="2" width="846" height="176" rx="14" fill="url(#quoteSpotlight)" />
  <rect x="2" y="2" width="846" height="176" rx="14" fill="url(#cardDots)" />
  <rect x="2" y="2" width="846" height="176" rx="14" stroke="url(#borderStroke)" stroke-width="1.2" />

  <!-- Large Stylized Watermark Quote Mark -->
  <text x="65" y="70" font-family="'Georgia', serif" font-size="70" font-weight="bold" fill="#38BDF8" opacity="0.18">
    “
  </text>
  <text x="785" y="145" text-anchor="end" font-family="'Georgia', serif" font-size="70" font-weight="bold" fill="#818CF8" opacity="0.18">
    ”
  </text>

  <!-- The Quote Headline -->
  <text x="425" y="66" text-anchor="middle" fill="url(#quoteTextGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Georgia', 'Playfair Display', serif" font-size="25" font-style="italic" font-weight="700" letter-spacing="0.5">
    “Build beyond the obvious.”
  </text>

  <!-- Supporting Philosophical Thought -->
  <text x="425" y="96" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" letter-spacing="0.2">
    Engineering intelligent digital products that bridge human creativity and machine precision.
  </text>

  <!-- Elegant Centered Accent Divider Line -->
  <line x1="340" y1="116" x2="510" y2="116" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />

  <!-- Attribution & Signature -->
  <text x="425" y="138" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">
    — ABU NAYEM
  </text>

  <text x="425" y="156" text-anchor="middle" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" letter-spacing="0.4">
    AI-Powered Full-Stack Developer • Etarnity Global
  </text>
</svg>
