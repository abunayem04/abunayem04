<svg width="850" height="240" viewBox="0 0 850 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="rpgBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#121624" />
      <stop offset="100%" stop-color="#080a0f" />
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="hpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <linearGradient id="mpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="expGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007F" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
  </defs>

  <!-- Card Frame -->
  <rect x="5" y="5" width="840" height="230" rx="14" fill="url(#rpgBg)" stroke="#1E293B" stroke-width="2" />
  <rect x="5" y="5" width="840" height="230" rx="14" fill="none" stroke="#00F0FF" stroke-width="1.5" opacity="0.4">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite" />
  </rect>

  <!-- Left Column: Character Sheet -->
  <g transform="translate(25, 20)">
    <!-- Header Title -->
    <text x="0" y="20" fill="#FF007F" font-family="'Courier New', monospace" font-size="14" font-weight="900" letter-spacing="2">
      🎮 CHARACTER PROFILE // LEVEL 99
    </text>
    <text x="0" y="48" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">
      Abu Nayem
    </text>

    <!-- Spec info items -->
    <text x="0" y="80" fill="#94A3B8" font-family="'Courier New', monospace" font-size="12" font-weight="bold">CLASS:</text>
    <text x="70" y="80" fill="#38BDF8" font-family="'Courier New', monospace" font-size="12" font-weight="bold">Fullstack Web Alchemist</text>

    <text x="0" y="105" fill="#94A3B8" font-family="'Courier New', monospace" font-size="12" font-weight="bold">GUILD:</text>
    <text x="70" y="105" fill="#F472B6" font-family="'Courier New', monospace" font-size="12" font-weight="bold">Etarnity Global</text>

    <text x="0" y="130" fill="#94A3B8" font-family="'Courier New', monospace" font-size="12" font-weight="bold">REALM:</text>
    <text x="70" y="130" fill="#E2E8F0" font-family="'Courier New', monospace" font-size="12" font-weight="bold">Khulna, Bangladesh 🇧🇩</text>

    <text x="0" y="155" fill="#94A3B8" font-family="'Courier New', monospace" font-size="12" font-weight="bold">ALIGN:</text>
    <text x="70" y="155" fill="#10B981" font-family="'Courier New', monospace" font-size="12" font-weight="bold">Chaotic Productive / AI</text>

    <!-- Radar Stat Badges -->
    <g transform="translate(0, 175)">
      <rect x="0" y="0" width="70" height="26" rx="6" fill="#1E293B" stroke="#334155" />
      <text x="35" y="17" text-anchor="middle" fill="#38BDF8" font-family="'Courier New', monospace" font-size="11" font-weight="bold">INT: 99</text>

      <rect x="78" y="0" width="70" height="26" rx="6" fill="#1E293B" stroke="#334155" />
      <text x="113" y="17" text-anchor="middle" fill="#10B981" font-family="'Courier New', monospace" font-size="11" font-weight="bold">SPD: 96</text>

      <rect x="156" y="0" width="70" height="26" rx="6" fill="#1E293B" stroke="#334155" />
      <text x="191" y="17" text-anchor="middle" fill="#F43F5E" font-family="'Courier New', monospace" font-size="11" font-weight="bold">ATK: 98</text>

      <rect x="234" y="0" width="70" height="26" rx="6" fill="#1E293B" stroke="#334155" />
      <text x="269" y="17" text-anchor="middle" fill="#A855F7" font-family="'Courier New', monospace" font-size="11" font-weight="bold">AI: 95</text>
    </g>
  </g>

  <!-- Vertical Divider -->
  <line x1="365" y1="25" x2="365" y2="215" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Right Column: Status Bars & Gauges -->
  <g transform="translate(395, 20)">
    <text x="0" y="20" fill="#00F0FF" font-family="'Courier New', monospace" font-size="14" font-weight="900" letter-spacing="2">
      ⚡ REAL-TIME COMBAT GAUGES
    </text>

    <!-- HP BAR -->
    <g transform="translate(0, 40)">
      <text x="0" y="12" fill="#E2E8F0" font-family="'Courier New', monospace" font-size="12" font-weight="bold">HEALTH (Clean Architecture)</text>
      <text x="420" y="12" text-anchor="end" fill="#10B981" font-family="'Courier New', monospace" font-size="12" font-weight="bold">100%</text>
      <rect x="0" y="18" width="420" height="14" rx="7" fill="#1E293B" />
      <rect x="0" y="18" width="420" height="14" rx="7" fill="url(#hpGrad)">
        <animate attributeName="width" values="320;420;420" dur="2s" />
      </rect>
    </g>

    <!-- MP BAR -->
    <g transform="translate(0, 85)">
      <text x="0" y="12" fill="#E2E8F0" font-family="'Courier New', monospace" font-size="12" font-weight="bold">MANA (Caffeine &amp; Creativity)</text>
      <text x="420" y="12" text-anchor="end" fill="#00F0FF" font-family="'Courier New', monospace" font-size="12" font-weight="bold">100%</text>
      <rect x="0" y="18" width="420" height="14" rx="7" fill="#1E293B" />
      <rect x="0" y="18" width="420" height="14" rx="7" fill="url(#mpGrad)">
        <animate attributeName="width" values="280;420;420" dur="2.4s" />
      </rect>
    </g>

    <!-- EXP BAR -->
    <g transform="translate(0, 130)">
      <text x="0" y="12" fill="#E2E8F0" font-family="'Courier New', monospace" font-size="12" font-weight="bold">EXP (Next Mastery Tier)</text>
      <text x="420" y="12" text-anchor="end" fill="#FF007F" font-family="'Courier New', monospace" font-size="12" font-weight="bold">94%</text>
      <rect x="0" y="18" width="420" height="14" rx="7" fill="#1E293B" />
      <rect x="0" y="18" width="395" height="14" rx="7" fill="url(#expGrad)">
        <animate attributeName="width" values="150;395;395" dur="2.8s" />
      </rect>
    </g>
  </g>
</svg>
