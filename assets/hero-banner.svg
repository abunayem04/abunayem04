<svg width="850" height="190" viewBox="0 0 850 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F141C" />
      <stop offset="100%" stop-color="#090D14" />
    </linearGradient>

    <!-- Top Accent Gradient Line -->
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.4" />
    </linearGradient>

    <!-- Subtle Title Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Subtle Grid -->
    <pattern id="cleanGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255, 255, 255, 0.02)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Base Card -->
  <rect x="2" y="2" width="846" height="186" rx="12" fill="url(#cardBg)" stroke="#222C3A" stroke-width="1" />
  <rect x="2" y="2" width="846" height="186" rx="12" fill="url(#cleanGrid)" />

  <!-- Top Sleek Accent Border -->
  <path d="M 14 3 L 836 3" stroke="url(#accentLine)" stroke-width="2" stroke-linecap="round" />

  <!-- Role Tag -->
  <g transform="translate(45, 32)">
    <rect width="210" height="24" rx="6" fill="#1E293B" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
    <text x="105" y="16" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2">
      FRONTEND &amp; UI ENGINEER
    </text>
  </g>

  <!-- Live Status Badge (Top Right) -->
  <g transform="translate(620, 32)">
    <rect width="185" height="24" rx="6" fill="#132E24" stroke="#1D533B" stroke-width="1" />
    <circle cx="16" cy="12" r="4" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="16" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">
      AVAILABLE FOR WORK
    </text>
  </g>

  <!-- Main Name Title -->
  <text x="45" y="105" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="38" letter-spacing="-0.5">
    Abu Nayem
  </text>

  <!-- Professional Subtitle -->
  <text x="45" y="135" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" letter-spacing="0.1">
    Crafting high-performance, accessible web interfaces and modern digital experiences.
  </text>

  <!-- Meta details bar -->
  <g transform="translate(45, 162)">
    <!-- Location -->
    <text x="0" y="0" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
      📍 Khulna, Bangladesh
    </text>
    <text x="145" y="0" fill="#334155" font-family="sans-serif" font-size="12">•</text>

    <!-- Company -->
    <text x="160" y="0" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
      💼 Etarnity Global
    </text>
    <text x="270" y="0" fill="#334155" font-family="sans-serif" font-size="12">•</text>

    <!-- Website -->
    <text x="285" y="0" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
      🌐 abunayem.com
    </text>
  </g>
</svg>
