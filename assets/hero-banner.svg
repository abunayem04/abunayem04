<svg width="850" height="230" viewBox="0 0 850 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141926" />
      <stop offset="100%" stop-color="#080a0f" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF">
        <animate attributeName="stop-color" values="#00F0FF;#FF007F;#7000FF;#00F0FF" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#FF007F">
        <animate attributeName="stop-color" values="#FF007F;#7000FF;#00F0FF;#FF007F" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Border Glow Filter -->
    <filter id="borderGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Pattern Grid Lines -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 240, 255, 0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Container Box -->
  <rect x="5" y="5" width="840" height="220" rx="16" fill="url(#bgGrad)" />
  <rect x="5" y="5" width="840" height="220" rx="16" fill="url(#cyberGrid)" />
  
  <!-- Glowing Border with Color Animation -->
  <rect x="5" y="5" width="840" height="220" rx="16" fill="none" stroke="#00F0FF" stroke-width="2.5" filter="url(#borderGlow)">
    <animate attributeName="stroke" values="#00F0FF;#FF007F;#8B5CF6;#00F0FF" dur="5s" repeatCount="indefinite" />
  </rect>

  <!-- Corner Tech Accents -->
  <path d="M 20 15 L 15 15 L 15 35" stroke="#FF007F" stroke-width="3" fill="none" />
  <path d="M 830 15 L 835 15 L 835 35" stroke="#00F0FF" stroke-width="3" fill="none" />
  <path d="M 15 205 L 15 215 L 35 215" stroke="#00F0FF" stroke-width="3" fill="none" />
  <path d="M 835 205 L 835 215 L 815 215" stroke="#FF007F" stroke-width="3" fill="none" />

  <!-- Top Badge Tag -->
  <g transform="translate(325, 22)">
    <rect width="200" height="24" rx="12" fill="#FF007F" fill-opacity="0.15" stroke="#FF007F" stroke-width="1.2">
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </rect>
    <text x="100" y="16" text-anchor="middle" fill="#FF007F" font-family="'Courier New', monospace" font-size="11" font-weight="900" letter-spacing="2.5">
      ⚡ PLAYER 1: ONLINE ⚡
    </text>
  </g>

  <!-- Main Hero Title -->
  <text x="425" y="105" text-anchor="middle" fill="url(#titleGrad)" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-weight="900" font-size="44" letter-spacing="8" filter="url(#neonGlow)">
    ABU NAYEM
  </text>

  <!-- Subtitle -->
  <text x="425" y="145" text-anchor="middle" fill="#38BDF8" font-family="'Courier New', monospace" font-weight="bold" font-size="14" letter-spacing="3.5">
    ⚔️ LEVEL 99 WEB ARCHITECT • AI TECHNOMANCER 🎮
  </text>

  <!-- Status Bar Line -->
  <line x1="120" y1="168" x2="730" y2="168" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

  <!-- Live Status Indicators -->
  <g transform="translate(250, 182)">
    <!-- Blinking Green Beacon -->
    <circle cx="10" cy="10" r="4.5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="10" cy="10" r="8" fill="none" stroke="#10B981" stroke-width="1" opacity="0.6">
      <animate attributeName="r" values="4;11;4" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="14" fill="#A5B4FC" font-family="'Courier New', monospace" font-size="12" font-weight="bold" letter-spacing="1">
      QUEST STATUS: READY TO BUILD EPIC CODE
    </text>
  </g>
</svg>
