<svg width="850" height="230" viewBox="0 0 850 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Vercel Spotlight Glow -->
    <radialGradient id="vercelSpotlight" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#0070F3" stop-opacity="0.35" />
      <stop offset="35%" stop-color="#7928CA" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#00DFD8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Mesh Pattern -->
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.04" />
    </pattern>

    <!-- Precision Top Border Gradient -->
    <linearGradient id="vercelBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="20%" stop-color="#0070F3" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00DFD8" stop-opacity="1" />
      <stop offset="80%" stop-color="#7928CA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#18181B" />
    </linearGradient>

    <!-- High-end Next.js Title Gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#A1A1AA" />
    </linearGradient>

    <!-- React Cyan Glow -->
    <linearGradient id="reactGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#61DAFB" />
      <stop offset="100%" stop-color="#0070F3" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Black Background -->
  <rect width="850" height="230" rx="16" fill="#000000" />
  <rect width="850" height="230" rx="16" fill="url(#vercelSpotlight)" />
  <rect width="850" height="230" rx="16" fill="url(#dotGrid)" />

  <!-- Outer Border Frame -->
  <rect x="0.5" y="0.5" width="849" height="229" rx="15.5" stroke="#1F1F23" stroke-width="1" />
  
  <!-- Glowing Top Border Accent (Vercel Style) -->
  <path d="M 16 1 L 834 1" stroke="url(#vercelBorder)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Top Announcement Badge (Next.js Conf / Vercel style) -->
  <g transform="translate(45, 28)">
    <rect width="270" height="26" rx="13" fill="#09090B" stroke="#27272A" stroke-width="1" />
    <!-- Gradient Dot -->
    <circle cx="14" cy="13" r="4" fill="#0070F3">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="17" fill="#E4E4E7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">
      REACT 19 &amp; NEXT.js 15 ARCHITECT
    </text>
    <text x="248" y="17" fill="#71717A" font-family="sans-serif" font-size="11">→</text>
  </g>

  <!-- Live Deployment / Available Status (Top Right) -->
  <g transform="translate(640, 28)">
    <rect width="165" height="26" rx="13" fill="#052E16" fill-opacity="0.5" stroke="#14532D" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#22C55E">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="14" cy="13" r="7" fill="none" stroke="#22C55E" stroke-width="1" opacity="0.4">
      <animate attributeName="r" values="4;10;4" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="17" fill="#4ADE80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.4">
      READY TO DEPLOY
    </text>
  </g>

  <!-- React Atom Icon Artwork (Subtle Floating Right) -->
  <g transform="translate(730, 130)" opacity="0.85">
    <ellipse rx="42" ry="16" fill="none" stroke="url(#reactGrad)" stroke-width="1.5" opacity="0.7" />
    <ellipse rx="42" ry="16" fill="none" stroke="url(#reactGrad)" stroke-width="1.5" transform="rotate(60)" opacity="0.7" />
    <ellipse rx="42" ry="16" fill="none" stroke="url(#reactGrad)" stroke-width="1.5" transform="rotate(120)" opacity="0.7" />
    <circle r="5" fill="#61DAFB" filter="url(#softGlow)" />
  </g>

  <!-- Main Hero Title (Vercel Typography) -->
  <text x="45" y="112" fill="url(#textGradient)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" letter-spacing="-1.5">
    Abu Nayem
  </text>

  <!-- Next.js Clean Subtitle -->
  <text x="45" y="144" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" letter-spacing="-0.2">
    Frontend Engineer crafting high-performance, accessible web interfaces.
  </text>

  <!-- Vercel Metric Pills (Bottom Row) -->
  <g transform="translate(45, 178)">
    <!-- Location Pill -->
    <rect x="0" y="0" width="160" height="26" rx="6" fill="#09090B" stroke="#27272A" stroke-width="1" />
    <text x="12" y="17" fill="#71717A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500">📍 Khulna, Bangladesh</text>

    <!-- Org Pill -->
    <rect x="170" y="0" width="150" height="26" rx="6" fill="#09090B" stroke="#27272A" stroke-width="1" />
    <text x="182" y="17" fill="#71717A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500">🏢 Etarnity Global</text>

    <!-- Domain Pill -->
    <rect x="330" y="0" width="145" height="26" rx="6" fill="#0A101D" stroke="#1E293B" stroke-width="1" />
    <text x="342" y="17" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">🌐 abunayem.com</text>

    <!-- Lighthouse 100% Pill -->
    <rect x="485" y="0" width="145" height="26" rx="6" fill="#052E16" fill-opacity="0.6" stroke="#14532D" stroke-width="1" />
    <text x="497" y="17" fill="#4ADE80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">⚡ 100% Performance</text>
  </g>
</svg>
