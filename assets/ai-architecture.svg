<svg viewBox="0 0 880 250" width="100%" height="250" xmlns="http://www.w3.org/2000/svg" fill="none">
<defs>

      <!-- Background & Card Gradients -->
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0E1322"/>
        <stop offset="50%" stop-color="#080C16"/>
        <stop offset="100%" stop-color="#04060B"/>
      </linearGradient>

      <linearGradient id="cardUser" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.05"/>
      </linearGradient>

      <linearGradient id="cardGateway" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.05"/>
      </linearGradient>

      <linearGradient id="cardCore" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#A855F7" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#6366F1" stop-opacity="0.15"/>
      </linearGradient>

      <linearGradient id="cardRAG" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.05"/>
      </linearGradient>

      <linearGradient id="cardLLM" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#EC4899" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="#EC4899" stop-opacity="0.05"/>
      </linearGradient>

      <linearGradient id="cardTools" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#10B981" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="#10B981" stop-opacity="0.05"/>
      </linearGradient>

      <linearGradient id="cardOutput" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#34D399" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#10B981" stop-opacity="0.15"/>
      </linearGradient>

      <!-- Glow Filters -->
      <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>

      <!-- Subtle Dot Pattern -->
      <pattern id="archDots" width="18" height="18" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.03"/>
      </pattern>
    
</defs>
<rect width="880" height="250" rx="12" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.2"/>
<rect width="880" height="250" rx="12" fill="url(#archDots)"/>
<path d="M 130 125 L 165 125" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="4 3" opacity="0.6"/>
<path d="M 290 125 L 325 125" stroke="#60A5FA" stroke-width="1.8" stroke-dasharray="4 3" opacity="0.6"/>
<path d="M 465 110 C 485 110, 485 55, 505 55" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="4 3" opacity="0.6"/>
<path d="M 465 125 L 505 125" stroke="#EC4899" stroke-width="1.8" stroke-dasharray="4 3" opacity="0.6"/>
<path d="M 465 140 C 485 140, 485 195, 505 195" stroke="#10B981" stroke-width="1.8" stroke-dasharray="4 3" opacity="0.6"/>
<path d="M 665 55 C 685 55, 685 115, 705 115" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="4 3" opacity="0.6"/>
