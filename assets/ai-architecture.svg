        <circle r="3" fill="#38BDF8" filter="url(#coreGlow)">
          <animateMotion path="M 130 125 L 165 125" dur="2.2s" repeatCount="indefinite" />
        </circle>
        

        <circle r="3" fill="#60A5FA" filter="url(#coreGlow)">
          <animateMotion path="M 290 125 L 325 125" dur="2.6s" repeatCount="indefinite" />
        </circle>
        

        <circle r="3" fill="#F59E0B" filter="url(#coreGlow)">
          <animateMotion path="M 465 110 C 485 110, 485 55, 505 55" dur="3.0s" repeatCount="indefinite" />
        </circle>
        

        <circle r="3" fill="#EC4899" filter="url(#coreGlow)">
          <animateMotion path="M 465 125 L 505 125" dur="2.2s" repeatCount="indefinite" />
        </circle>
        

        <circle r="3" fill="#10B981" filter="url(#coreGlow)">
          <animateMotion path="M 465 140 C 485 140, 485 195, 505 195" dur="2.6s" repeatCount="indefinite" />
        </circle>
        

        <circle r="3" fill="#F59E0B" filter="url(#coreGlow)">
          <animateMotion path="M 665 55 C 685 55, 685 115, 705 115" dur="3.0s" repeatCount="indefinite" />
        </circle>
        

        <circle r="3" fill="#EC4899" filter="url(#coreGlow)">
          <animateMotion path="M 665 125 L 705 125" dur="2.2s" repeatCount="indefinite" />
        </circle>
        

        <circle r="3" fill="#10B981" filter="url(#coreGlow)">
          <animateMotion path="M 665 195 C 685 195, 685 135, 705 135" dur="2.6s" repeatCount="indefinite" />
        </circle>
        
<rect x="20" y="95" width="110" height="60" rx="10" fill="url(#cardUser)" stroke="#38BDF8" stroke-width="1.2"/>
<text x="75.0" y="121.0" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">👤 User Request</text>
<text x="75.0" y="138.0" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500">Intent / Prompt</text>
<rect x="165" y="95" width="125" height="60" rx="10" fill="url(#cardGateway)" stroke="#60A5FA" stroke-width="1.2"/>
<text x="227.5" y="121.0" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">⚡ API Gateway</text>
<text x="227.5" y="138.0" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500">Next.js / Edge SSR</text>
<rect x="325" y="85" width="140" height="80" rx="12" fill="url(#cardCore)" stroke="#A855F7" stroke-width="1.8" filter="url(#coreGlow)"/>
<rect x="325" y="85" width="140" height="80" rx="12" fill="none" stroke="#C084FC" stroke-width="1">
