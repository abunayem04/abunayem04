<text x="395" y="132" text-anchor="middle" fill="#E9D5FF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600">Planner • Memory</text>
<text x="395" y="147" text-anchor="middle" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="500">ReAct Decision Loop</text>
<rect x="505" y="25" width="160" height="52" rx="10" fill="url(#cardRAG)" stroke="#F59E0B" stroke-width="1.2"/>
<text x="585.0" y="47.0" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">📚 RAG & Vector DB</text>
<text x="585.0" y="64.0" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500">Embeddings & Semantic Search</text>
<rect x="505" y="99" width="160" height="52" rx="10" fill="url(#cardLLM)" stroke="#EC4899" stroke-width="1.2"/>
<text x="585.0" y="121.0" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">🤖 Foundation LLMs</text>
<text x="585.0" y="138.0" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500">Claude 3.5 • GPT-4o • Gemini</text>
<rect x="505" y="170" width="160" height="52" rx="10" fill="url(#cardTools)" stroke="#10B981" stroke-width="1.2"/>
<text x="585.0" y="192.0" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">🛠️ Tool Calling Engine</text>
<text x="585.0" y="209.0" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500">Sandboxed APIs & Workers</text>
<rect x="705" y="95" width="155" height="60" rx="12" fill="url(#cardOutput)" stroke="#34D399" stroke-width="1.2"/>
<text x="782.5" y="121.0" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">✨ Verified Solution</text>
<text x="782.5" y="138.0" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500">Structured JSON / Action</text>
</svg>